<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>newscraper</title>
    <link rel="icon" type="image/jpeg" href="icon/icon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 3rem 1.5rem;
            background: #0c0808;
            color: #d9c9c9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 760px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 0.25rem;
            text-align: center;
        }

        h1 a {
            color: #f0f6fc;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        h1 a:hover {
            color: #e83c3c;
        }

        .count {
            text-align: center;
            color: #8b949e;
            font-size: 0.95rem;
            margin: 0 0 2.5rem;
        }

        .item {
            padding: 1.25rem 0;
            border-bottom: 1px solid #2d2121;
        }

        .item:last-child {
            border-bottom: none;
        }

        .title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .title a {
            color: #e2c3c3;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .title a:hover {
            color: #ee6f6f;
        }

        .meta {
            color: #5e5555;
            font-size: 0.85rem;
        }

        .meta .site {
            color: #a88f8f;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .meta .site:hover {
            color: #b15e5e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><a href="https://github.com/athesew/newscraper" target="_blank" rel="noopener">newscraper</a></h1>
        <p class="count">{{len .Items}} news scraped</p>
        {{range .Items}}
        <div class="item">
            <div class="title"><a href="{{.Link}}" target="_blank" rel="noopener">{{.Title}}</a></div>
            <div class="meta">source: <a class="site" href="{{.Link}}" target="_blank" rel="noopener">{{.Site}}</a> | date: {{.Date}}</div>
        </div>
        {{end}}
    </div>
</body>
</html>
